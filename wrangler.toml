name = "sunsethue-helper"
pages_build_output_dir = "./public"
compatibility_date = "2026-06-20"
compatibility_flags = [ "nodejs_compat" ]

[[services]]
binding = "API_SERVICE"
service = "sunsethue-helper-worker"

# Preview deployments are not covered by the production Access application.
# Keep the same private Worker binding so /api/* fails closed on JWT checks.
[env.preview]
compatibility_date = "2026-06-20"
compatibility_flags = [ "nodejs_compat" ]

[[env.preview.services]]
binding = "API_SERVICE"
service = "sunsethue-helper-worker"
