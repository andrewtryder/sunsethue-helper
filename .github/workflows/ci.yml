name: CI

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate commit messages
        run: npx commitplease ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Run ESLint Security Scans
        run: npm run lint

      - name: Run Dependency Audit
        run: |
          npm audit --audit-level=high

      - name: Run Frontend Structural Tests
        run: node scripts/test-frontend.js

      - name: Run Frontend Unit Tests
        run: node scripts/test-frontend-unit.mjs
