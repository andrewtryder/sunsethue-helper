name: Bug report
description: Report a defect in local development, CI, or deployed behavior
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** paste production secrets, Access JWTs, unredacted logs, or personal emails.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Prefer a local clone with synthetic `.env` / `.dev.vars` values.
      placeholder: |
        1. npm ci
        2. cp .env.example .env
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and whether this is local or production.
      placeholder: Node 24 / macOS / local wrangler
  - type: checkboxes
    id: secrets
    attributes:
      label: Confirmation
      options:
        - label: This report does not contain real credentials, tokens, or unredacted production logs.
          required: true
