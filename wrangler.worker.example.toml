# Template for the private API Worker configuration.
# Run `npm run config:generate` to render wrangler.worker.toml from environment values.
# Do not put production database IDs or secrets in this file.

name = "{{WORKER_NAME}}"
main = "worker/index.js"
compatibility_date = "2026-05-01"
compatibility_flags = [ "nodejs_compat" ]

# Keep the Worker private. Browser traffic reaches it only through the
# Pages Function service binding after Cloudflare Access admission.
workers_dev = false
preview_urls = false

# AUTHORIZED_EMAIL, TEAM_DOMAIN, and POLICY_AUD are Worker secrets.
# Do not commit account-specific Access values.
# Provider transport credentials are read from Secrets Store bindings below.
# CLOUDFLARE_API_TOKEN must never be present on this Worker.

[triggers]
# Hourly UTC; worker/cron.js evaluates local scheduleTimes in scheduleTimezone.
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "{{D1_DATABASE_NAME}}"
database_id = "{{D1_DATABASE_ID}}"

[[services]]
binding = "CREDENTIAL_ADMIN"
service = "{{CREDENTIAL_ADMIN_WORKER_NAME}}"
entrypoint = "CredentialAdminEntrypoint"

[[secrets_store_secrets]]
binding = "EMAIL_TRANSPORT_SECRET"
store_id = "{{SECRETS_STORE_ID}}"
secret_name = "SUNSETHUE_EMAIL_TRANSPORT"

[[secrets_store_secrets]]
binding = "PUSHOVER_TRANSPORT_SECRET"
store_id = "{{SECRETS_STORE_ID}}"
secret_name = "SUNSETHUE_PUSHOVER_TRANSPORT"

[[secrets_store_secrets]]
binding = "WEBHOOK_TRANSPORT_SECRET"
store_id = "{{SECRETS_STORE_ID}}"
secret_name = "SUNSETHUE_WEBHOOK_TRANSPORT"

[[secrets_store_secrets]]
binding = "WEB_PUSH_VAPID_PRIVATE"
store_id = "{{SECRETS_STORE_ID}}"
secret_name = "SUNSETHUE_WEB_PUSH_VAPID"

# Non-secret Web Push config (set via Wrangler vars / CI):
# WEB_PUSH_VAPID_PUBLIC_KEY, WEB_PUSH_SUBJECT (mailto: or https URL)
