name: Rollback production

# Manual only, and it never guesses a target: the exact prior Worker version and/or
# Pages deployment identifier must be supplied. Both are validated against this
# application before anything changes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to roll back.
        type: choice
        required: true
        default: both
        options:
          - both
          - worker
          - pages
      worker_version_id:
        description: Exact Worker version id to restore (from the deployment job summary).
        type: string
        required: false
      pages_deployment_id:
        description: Exact Pages production deployment id to restore.
        type: string
        required: false
      reason:
        description: Why this rollback is happening.
        type: string
        required: true

# Shares the production group so a rollback can never overlap a deployment.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rollback:
    name: Roll back and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler configuration
        env:
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PRODUCTION_HOSTNAME: ${{ vars.PRODUCTION_HOSTNAME }}
          ACCESS_HOSTNAME: ${{ vars.ACCESS_HOSTNAME }}
          AUTHORIZED_EMAIL: ${{ secrets.AUTHORIZED_EMAIL }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
        run: npm run config:generate:strict

      - name: Validate identifiers and roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ inputs.target }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          PAGES_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PRODUCTION_HOSTNAME: ${{ vars.PRODUCTION_HOSTNAME }}
          ACCESS_HOSTNAME: ${{ vars.ACCESS_HOSTNAME }}
          AUTHORIZED_EMAIL: ${{ secrets.AUTHORIZED_EMAIL }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
        run: npm run rollback:production

      - name: Post-rollback smoke tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PRODUCTION_HOSTNAME: ${{ vars.PRODUCTION_HOSTNAME }}
          ACCESS_HOSTNAME: ${{ vars.ACCESS_HOSTNAME }}
          AUTHORIZED_EMAIL: ${{ secrets.AUTHORIZED_EMAIL }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
        run: npm run verify:production
