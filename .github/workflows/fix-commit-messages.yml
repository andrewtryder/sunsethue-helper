name: Fix commit messages

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix-commit-messages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync fix scripts from main
        run: git checkout origin/main -- scripts/wrap-commit-message.js scripts/fix-commit-messages.sh package.json package-lock.json

      - name: Fix and push commit messages
        run: |
          bash scripts/fix-commit-messages.sh \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }}
