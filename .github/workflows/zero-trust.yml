name: Zero Trust Access infrastructure

# Cloudflare Access administration is a separate trust domain from application
# deployment. It runs only when a maintainer triggers it, uses its own token, and
# defaults to a read-only plan.
on:
  workflow_dispatch:
    inputs:
      action:
        description: plan is read-only. apply mutates the Sunsethue Access application only.
        type: choice
        required: true
        default: plan
        options:
          - plan
          - verify
          - apply

concurrency:
  group: sunsethue-zero-trust
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zero-trust:
    name: ${{ inputs.action }} Access configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://sunsethue-helper.pages.dev
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never prints tokens, JWTs, cookies, or identity-provider secrets; the
      # Audience tag is redacted in all output.
      - name: Run Access automation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZEROTRUST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHORIZED_EMAIL: ${{ secrets.AUTHORIZED_EMAIL }}
          ACCESS_ACTION: ${{ inputs.action }}
        run: bash scripts/run-access-action.sh
