# Template for the private credential-administration Worker.
# Callable only via the main Worker's CREDENTIAL_ADMIN service binding.
# Do not put production secrets in this file.

name = "{{CREDENTIAL_ADMIN_WORKER_NAME}}"
main = "worker/credential-admin/index.js"
compatibility_date = "2026-05-01"
compatibility_flags = [ "nodejs_compat" ]

workers_dev = false
preview_urls = false

# Non-secret deployment variables.
[vars]
CLOUDFLARE_ACCOUNT_ID = "{{CLOUDFLARE_ACCOUNT_ID}}"
SECRETS_STORE_ID = "{{SECRETS_STORE_ID}}"

# CLOUDFLARE_API_TOKEN is uploaded as a Worker secret for this Worker only.

[[secrets_store_secrets]]
binding = "EMAIL_TRANSPORT_SECRET"
store_id = "{{SECRETS_STORE_ID}}"
secret_name = "SUNSETHUE_EMAIL_TRANSPORT"

[[secrets_store_secrets]]
binding = "PUSHOVER_TRANSPORT_SECRET"
store_id = "{{SECRETS_STORE_ID}}"
secret_name = "SUNSETHUE_PUSHOVER_TRANSPORT"
