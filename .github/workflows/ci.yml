name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm ci

      - name: Validate commit messages
        run: npx commitplease ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Run Frontend Structural Tests
        run: node scripts/test-frontend.js

      - name: Run Frontend Unit Tests
        run: node scripts/test-frontend-unit.mjs

      - name: Run Backend Unit Tests with Coverage
        run: |
          npm ci --prefix functions
          npm run test:coverage --prefix functions

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests against Firebase Emulators
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
