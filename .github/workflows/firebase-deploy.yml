name: Deploy to Firebase on Push

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Frontend Structural Tests
        run: node scripts/test-frontend.js

      - name: Run Frontend Unit Tests
        run: node scripts/test-frontend-unit.mjs

      - name: Install Functions Dependencies
        run: npm ci --prefix functions

      - name: Run Backend Unit Tests
        run: npm test --prefix functions

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
