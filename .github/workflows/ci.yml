name: CI

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm ci

      - name: Validate commit messages
        run: npx commitplease ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Run Frontend Structural Tests
        run: node scripts/test-frontend.js

      - name: Run Frontend Unit Tests
        run: node scripts/test-frontend-unit.mjs

      - name: Run Backend Unit Tests with Coverage
        run: |
          npm ci --prefix functions
          npm run test:coverage --prefix functions
